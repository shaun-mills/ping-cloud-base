apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pingaccess-admin-ingress-via-was
spec:
  ingressClassName: nginx-public
  rules:
  - host: pingaccess-admin.ping-demo.com
    http:
      paths:
      - backend:
          service:
            name: pingaccess-was
            port:
              number: 443
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - pingaccess-admin.ping-demo.com
